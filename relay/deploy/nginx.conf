# /etc/nginx/sites-available/term.dkz12345.com
# Then: ln -sf ../sites-available/term.dkz12345.com /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx && certbot --nginx -d term.dkz12345.com
server {
    listen 80;
    server_name term.dkz12345.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 64k;

    # Long-lived WebSockets: the Mac agent (pings every 20 s) and phones (ping every 10 s).
    # Frames are end-to-end encrypted; nothing here needs to see or buffer them.
    location ~ ^/(agent|ws)$ {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
